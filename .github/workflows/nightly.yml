on:
  workflow_dispatch:

name: Nightly release (macOS only)

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, macos-13]
        include:
          - os: macos-latest
            name: macOS (M1)
            arch: arm64
            install: brew install nasm
            configure: cmake -B build -DCMAKE_OSX_ARCHITECTURES=arm64 -DWITH_FFMPEG_JOBS="$(sysctl -n hw.logicalcpu)"
            path: build/*.dmg

          - os: macos-13
            name: macOS (Intel)
            arch: x86_64
            install: brew install nasm
            configure: cmake -B build -DCMAKE_OSX_ARCHITECTURES=x86_64 -DWITH_FFMPEG_JOBS="$(sysctl -n hw.logicalcpu)"
            path: build/*.dmg

    name: ${{ matrix.name }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            build/*
            !${{ matrix.path }}
          key: ${{ runner.os }}-${{ matrix.arch }}-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cmake-

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Inject .metadata_never_index (prevent Spotlight indexing)
        run: |
          mkdir -p build/tmp_bundle/Contents
          touch build/tmp_bundle/.metadata_never_index || true

      - name: Disable Spotlight (best-effort)
        continue-on-error: true
        run: |
          sudo mdutil -i off / || true
          sudo mdutil -E / || true

      - name: macOS-13 cleanup (detach DMGs, kill processes, delete temp files)
        if: matrix.os == 'macos-13'
        run: |
          echo "🔍 Checking mounted volumes:"
          mount | grep /Volumes || true

          echo "📦 Checking DMG devices:"
          hdiutil info | grep /dev/ || true

          echo "💥 Detaching DMG devices (max 3 attempts)"
          for i in 1 2 3; do
            for dev in $(hdiutil info | grep '^/dev/' | awk '{print $1}'); do
              echo "→ Detaching $dev"
              hdiutil detach "$dev" -force || diskutil unmount force "$dev" || sudo umount -f "$dev" || true
            done
            sleep 2
          done

          echo "🗑️ Deleting leftover DMGs and Finder junk"
          find build/_CPack_Packages -name '*.dmg' -delete || true
          find build/_CPack_Packages -name '.DS_Store' -delete || true
          find build/_CPack_Packages -name '._*' -delete || true

          echo "🔒 Killing processes holding files in build/"
          PIDS=$(lsof +D ./build | awk 'NR>1 {print $2}' | sort -u)
          for pid in $PIDS; do
            echo "→ Killing PID $pid"
            sudo kill -9 "$pid" || true
          done

          echo "⏱️ Sleep to let cleanup settle"
          sleep 10

      - name: Delay before packaging (macOS-13)
        if: matrix.os == 'macos-13'
        run: sleep 15

      - name: Build and package with retry fallback
        run: |
          echo "🏗️ Attempting CPack package build"
          cmake --build build --target package || (
            echo "❗ Initial CPack packaging failed. Retrying after clean..."
            sleep 5
            find build/_CPack_Packages -name '*.dmg' -delete || true
            cmake --build build --target package
          )

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITGmania-${{ github.sha }}-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ matrix.path }}
          compression-level: 0
