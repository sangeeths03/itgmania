on:
  workflow_dispatch

name: Nightly release (macOS only)

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, macos-13]
        include:
          - os: macos-latest
            name: macOS (M1)
            arch: arm64
            install: brew install nasm
            configure: cmake -B build -DCMAKE_OSX_ARCHITECTURES=arm64 -DWITH_FFMPEG_JOBS="$(sysctl -n hw.logicalcpu)"
            release_flags: -DCMAKE_OSX_ARCHITECTURES=arm64
            path: build/ITGmania-*-NIGHTLY-git-*-macOS-M1-no-songs.dmg

          - os: macos-13
            name: macOS (Intel)
            arch: x86_64
            install: brew install nasm
            configure: cmake -B build -DCMAKE_OSX_ARCHITECTURES=x86_64 -DWITH_FFMPEG_JOBS="$(sysctl -n hw.logicalcpu)"
            release_flags: -DCMAKE_OSX_ARCHITECTURES=x86_64
            path: build/ITGmania-*-NIGHTLY-git-*-macOS-Intel-no-songs.dmg

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: |
            build/*
            !${{ matrix.path }}
          key: ${{ runner.os }}-${{ matrix.arch }}-cmake-build-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cmake-build-

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Cleanup mounted volumes and temp.dmg
        if: startsWith(matrix.os, 'macos')
        run: |
          echo "Unmounting any lingering DMG volumes..."
          for vol in $(hdiutil info | grep '^/dev/' | awk '{print $1}'); do
            echo "Detaching $vol"
            hdiutil detach "$vol" -force || true
          done
          echo "Cleaning old temp.dmg files..."
          find build/_CPack_Packages -type f -name 'temp.dmg' -delete || true

      - name: Wait briefly to avoid hdiutil conflicts
        if: startsWith(matrix.os, 'macos')
        run: sleep 3

      - name: Create nightly release
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_FULL_RELEASE=Off \
            -DWITH_NIGHTLY_RELEASE=On \
            -DWITH_CLUB_FANTASTIC=Off \
            -DCPACK_DMG_VOLUME_NAME="ITGmania_${{ matrix.os }}_${{ github.sha }}" \
            ${{ matrix.release_flags }}
          cmake --build build --target package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ITGmania-${{ github.sha }}-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ matrix.path }}
          compression-level: 0
