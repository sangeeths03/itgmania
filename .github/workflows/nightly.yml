on:
  workflow_dispatch:

name: Nightly release (macOS only)

# concurrency:
#   group: nightly-release-macos
#   cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, macos-13]
        include:
          - os: macos-latest
            name: macOS (M1)
            arch: arm64
            install: brew install nasm
            configure: cmake -B build -DCMAKE_OSX_ARCHITECTURES=arm64 -DWITH_FFMPEG_JOBS="$(sysctl -n hw.logicalcpu)"
            path: build/*.dmg
          - os: macos-13
            name: macOS (Intel)
            arch: x86_64
            install: brew install nasm
            configure: cmake -B build -DCMAKE_OSX_ARCHITECTURES=x86_64 -DWITH_FFMPEG_JOBS="$(sysctl -n hw.logicalcpu)"
            path: build/*.dmg

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: |
            build/*
            !${{ matrix.path }}
          key: ${{ runner.os }}-${{ matrix.arch }}-cmake-build-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cmake-build-

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Inject .metadata_never_index (prevent Spotlight indexing)
        run: |
          mkdir -p build/tmp_bundle/Contents
          touch build/tmp_bundle/.metadata_never_index || true
          
      - name: Disable Spotlight (best effort)
        continue-on-error: true
        run: |
          sudo mdutil -i off / || true
          sudo mdutil -E / || true
          
      - name: 🧹 Cleanup for macOS 13 runners
        if: matrix.os == 'macos-13'
        run: |
          echo "🔍 Mounted Volumes:"
          mount | grep /Volumes || true
          echo "📦 DMG Devices:"
          hdiutil info | grep /dev/ || true
          echo "💥 Attempting to detach mounted DMG volumes (up to 3 attempts)"
          for i in 1 2 3; do
            for dev in $(hdiutil info | grep '^/dev/' | awk '{print $1}'); do
              echo "→ Detaching $dev"
              hdiutil detach "$dev" -force || diskutil unmount force "$dev" || sudo umount -f "$dev" || true
            done
            sleep 2
          done
          echo "🗑️ Removing leftover DMGs and Finder metadata"
          find build/_CPack_Packages -name '*.dmg' -delete || true
          find build/_CPack_Packages -name '.DS_Store' -delete || true
          find build/_CPack_Packages -name '._*' -delete || true
          echo "🔒 Killing any processes holding files in build/"
          PIDS=$(lsof +D ./build | awk 'NR>1 {print $2}' | sort -u)
          for pid in $PIDS; do
            echo "→ Killing PID $pid"
            sudo kill -9 "$pid" || true
          done
          echo "⏱️ Waiting 10s for cleanup to settle"
          sleep 10
          
      - name: Sleep before packaging (macOS-13 only)
        if: matrix.os == 'macos-13'
        run: sleep 15

      - name: Create nightly release (with fallback retry)
        run: |
          echo "🏗️ Attempting to build package"
          cmake --build build --target package || (
            echo "❗ Initial packaging failed. Retrying after clean..."
            sleep 5
            find build/_CPack_Packages -type f -name "*.dmg" -delete || true
            cmake --build build --target package
          )
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ITGmania-${{ github.sha }}-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ matrix.path }}
          compression-level: 0
