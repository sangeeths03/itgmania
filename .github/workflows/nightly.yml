on:
  workflow_dispatch

name: Nightly release (macOS only)

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, macos-13]
        include:
          - os: macos-latest
            name: macOS (M1)
            arch: arm64
            install: brew install nasm
            configure: cmake -B build -DCMAKE_OSX_ARCHITECTURES=arm64 -DWITH_FFMPEG_JOBS="$(sysctl -n hw.logicalcpu)"
            release: |
              cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_FULL_RELEASE=Off -DWITH_NIGHTLY_RELEASE=On -DCMAKE_OSX_ARCHITECTURES=arm64 -DWITH_CLUB_FANTASTIC=Off
              cmake --build build --target package
            path: build/ITGmania-*-NIGHTLY-git-*-macOS-M1-no-songs.dmg
          - os: macos-13
            name: macOS (Intel)
            arch: x86_64
            install: brew install nasm
            configure: cmake -B build -DCMAKE_OSX_ARCHITECTURES=x86_64 -DWITH_FFMPEG_JOBS="$(sysctl -n hw.logicalcpu)"
            release: |
              cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_FULL_RELEASE=Off -DWITH_NIGHTLY_RELEASE=On -DCMAKE_OSX_ARCHITECTURES=x86_64 -DWITH_CLUB_FANTASTIC=Off
              cmake --build build --target package
            path: build/ITGmania-*-NIGHTLY-git-*-macOS-Intel-no-songs.dmg

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: |
            build/*
            !${{ matrix.path }}
          key: ${{ runner.os }}-${{ matrix.arch }}-cmake-build-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cmake-build-

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Configure
        run: ${{ matrix.configure }}

      - name: 🧹 Cleanup (macOS 13 only)
        if: matrix.os == 'macos-13'
        run: |
          echo "🧼 Mounted Volumes:"
          mount | grep /Volumes || true

          echo "📦 hdiutil info:"
          hdiutil info || true

          echo "💥 Detaching mounted volumes (up to 3 attempts)"
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            for dev in $(hdiutil info | grep '^/dev/' | awk '{print $1}'); do
              echo "Detaching $dev"
              hdiutil detach "$dev" -force || sudo umount -f "$dev" || true
            done
            sleep 2
          done

          echo "🗑️ Removing lingering DMGs and macOS artifacts"
          rm -f build/_CPack_Packages/macOS-Intel/DragNDrop/temp.dmg || true
          find build/_CPack_Packages -name '.DS_Store' -delete || true
          find build/_CPack_Packages -name '._*' -delete || true

          echo "🔒 Killing processes holding files in build/"
          PIDS=$(lsof +D ./build | awk 'NR>1 {print $2}' | sort -u)
          for pid in $PIDS; do
            echo "Killing PID $pid"
            sudo kill -9 "$pid" || true
          done

          echo "⏱️ Waiting briefly for system to settle"
          sleep 5

      - name: Create nightly release
        run: ${{ matrix.release }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ITGmania-${{ github.sha }}-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ matrix.path }}
          compression-level: 0
