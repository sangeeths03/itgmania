on:
  workflow_dispatch:

name: Nightly release (macOS only)


jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, macos-13]
        include:
          - os: macos-latest
            name: macOS (M1)
            arch: arm64
            install: brew install nasm create-dmg
            configure: cmake -B build -DCMAKE_OSX_ARCHITECTURES=arm64 -DWITH_FFMPEG_JOBS="$(sysctl -n hw.logicalcpu)"
            path: output/*.dmg
          - os: macos-13
            name: macOS (Intel)
            arch: x86_64
            install: brew install nasm create-dmg
            configure: cmake -B build -DCMAKE_OSX_ARCHITECTURES=x86_64 -DWITH_FFMPEG_JOBS="$(sysctl -n hw.logicalcpu)"
            path: output/*.dmg

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: |
            build/*
            !${{ matrix.path }}
          key: ${{ runner.os }}-${{ matrix.arch }}-cmake-build-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cmake-build-

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build the app bundle
        run: cmake --build build --config Release

      - name: Disable Spotlight and clean environment (macOS-13 only)
        if: matrix.os == 'macos-13'
        run: |
          sudo mdutil -i off / || true
          sudo mdutil -E / || true
          for dev in $(hdiutil info | grep '^/dev/' | awk '{print $1}'); do
            echo "Detaching $dev"
            hdiutil detach "$dev" -force || diskutil unmount force "$dev" || sudo umount -f "$dev" || true
          done
          find build -name '*.dmg' -delete || true
          find build -name '.DS_Store' -delete || true
          PIDS=$(lsof +D ./build | awk 'NR>1 {print $2}' | sort -u)
          for pid in $PIDS; do
            echo "Killing PID $pid"
            sudo kill -9 "$pid" || true
          done
          sleep 10

      - name: Generate DMG using create-dmg
        run: |
          mkdir -p output
          GIT_HASH=$(git rev-parse --short HEAD)
          APP_NAME="ITGmania"
          VOL_NAME="${APP_NAME}-${{ matrix.arch }}-${GIT_HASH}"
          create-dmg \
            --volname "${VOL_NAME}" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 200 190 \
            --app-drop-link 600 185 \
            "build/${APP_NAME}.app" \
            "output/${APP_NAME}-${{ matrix.arch }}-${GIT_HASH}.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ITGmania-${{ github.sha }}-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ matrix.path }}
          compression-level: 0
