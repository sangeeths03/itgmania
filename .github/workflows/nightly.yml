on:
  workflow_dispatch:

name: Nightly release (macOS only)

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, macos-13]
        include:
          - os: macos-latest
            name: macOS (M1)
            arch: arm64
            install: brew install nasm
            configure: cmake -B build -DCMAKE_OSX_ARCHITECTURES=arm64 -DWITH_FFMPEG_JOBS="$(sysctl -n hw.logicalcpu)"
            path: build/*.dmg

          - os: macos-13
            name: macOS (Intel)
            arch: x86_64
            install: brew install nasm
            configure: cmake -B build -DCMAKE_OSX_ARCHITECTURES=x86_64 -DWITH_FFMPEG_JOBS="$(sysctl -n hw.logicalcpu)"
            path: dmg_output/*.dmg

    name: ${{ matrix.name }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            build/*
            !${{ matrix.path }}
          key: ${{ runner.os }}-${{ matrix.arch }}-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cmake-

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Inject .metadata_never_index (prevent Spotlight indexing)
        run: |
          mkdir -p build/tmp_bundle/Contents
          touch build/tmp_bundle/.metadata_never_index || true

      - name: Disable Spotlight (best-effort)
        continue-on-error: true
        run: |
          sudo mdutil -i off / || true
          sudo mdutil -E / || true

      - name: macOS-13 cleanup (detach DMGs, kill processes, delete temp files)
        if: matrix.os == 'macos-13'
        run: |
          echo "🧹 Cleaning up old DMG devices..."
          for dev in $(hdiutil info | grep '^/dev/' | awk '{print $1}'); do
            echo "Detaching $dev..."
            hdiutil detach "$dev" -force || diskutil unmount force "$dev" || sudo umount -f "$dev" || true
          done
          sleep 5
          echo "🧼 Deleting temp files..."
          find build/_CPack_Packages -name '*.dmg' -delete || true
          find build/_CPack_Packages -name '.DS_Store' -delete || true
          find build/_CPack_Packages -name '._*' -delete || true
          echo "🔫 Killing processes holding build/"
          PIDS=$(lsof +D ./build | awk 'NR>1 {print $2}' | sort -u)
          for pid in $PIDS; do
            sudo kill -9 "$pid" || true
          done
          sleep 10

      - name: Build project (no packaging)
        run: cmake --build build

      - name: Install app to build directory
        if: matrix.os == 'macos-13'
        run: |
          echo "🔧 Installing .app bundle to build/ directory"
          cmake --install build --prefix build

      - name: Manually create DMG on macOS-13
        if: matrix.os == 'macos-13'
        run: |
          set -e
          DMG_NAME="ITGmania-${{ github.sha }}-${{ matrix.arch }}.dmg"
          VOL_NAME="ITGmania-${{ github.sha }}"
          APP_PATH="build/ITGmania.app"
          OUT_DIR="dmg_output"
          mkdir -p "$OUT_DIR"
          echo "🔍 Checking if .app exists at $APP_PATH"
          ls -la "$APP_PATH" || { echo "❌ .app not found!"; exit 1; }
          echo "📦 Creating DMG manually..."
          for i in 1 2 3; do
            hdiutil create -ov -volname "$VOL_NAME" \
              -fs HFS+ -format UDZO \
              -srcfolder "$APP_PATH" \
              "$OUT_DIR/$DMG_NAME" && break
            echo "❗ hdiutil failed (attempt $i), retrying..."
            sleep $((5 * i))
            pkill -9 hdiutil || true
          done
          echo "📁 DMG directory listing:"
          ls -la "$OUT_DIR"

      - name: CPack DMG (macOS-latest only)
        if: matrix.os == 'macos-latest'
        run: |
          cmake --build build --target package

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITGmania-${{ github.sha }}-${{ matrix.name }}-${{ matrix.arch }}
          path: |
            build/*.dmg
            dmg_output/*.dmg
          compression-level: 0
